[project]
name = "youtopia"
version = "0.1.0"
description = "Small, achievable daily tasks that give purpose in a post-work world."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlmodel>=0.0.48",
    "typer>=0.27.3",
]

[project.scripts]
youtopia = "youtopia.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
# S311: `random` only picks tasks and phrases, never anything security-related.
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert by design, and run subprocesses and fake secrets on purpose.
"tests/**" = ["S101", "S102", "S105", "S106", "S108", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "zensical>=0.0.70",
]
