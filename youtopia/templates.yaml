    - {args: [["##.", "#..", "..#"]], expected: 3}
    - {args: [["###", "###"]], expected: 6}
    - {args: [["#.#.#", ".#.#.", "#.#.#"]], expected: 1}

- title: Stepping stones
  domain: caretaking
  difficulty: 4
  duration_minutes: 30
  instructions: |-
    You start on stone 0. From stone i you can hop forward up to stones[i] stones. Return True if you can reach the last stone.

    Example 1:
      can_hop_across([2, 3, 1, 1, 4]) -> True
    Example 2:
      can_hop_across([3, 2, 1, 0, 4]) -> False

    Constraints: 1 <= len(stones) <= 10^4; 0 <= stones[i] <= 10^5.
  done_criteria: All hidden tests pass.
  function: can_hop_across
  signature: 'def can_hop_across(stones: list[int]) -> bool:'
  tests:
    - {args: [[2, 3, 1, 1, 4]], expected: true}
    - {args: [[3, 2, 1, 0, 4]], expected: false}
    - {args: [[0]], expected: true}
    - {args: [[1, 0]], expected: true}
    - {args: [[0, 1]], expected: false}
    - {args: [[2, 0, 0]], expected: true}

- title: Fair treats
  domain: caretaking
  difficulty: 5
  duration_minutes: 45
  instructions: |-
    Pets stand in a row with these good-behaviour ratings. Every pet gets at least one treat, and a pet rated higher than a neighbour gets more treats than that neighbour. Return the fewest treats needed.

    Example 1:
      fair_treats([1, 0, 2]) -> 5
    Example 2:
      fair_treats([1, 2, 2]) -> 4

    Constraints: 1 <= len(ratings) <= 2 * 10^4.
  done_criteria: All hidden tests pass.
  function: fair_treats
  signature: 'def fair_treats(ratings: list[int]) -> int:'
  tests:
