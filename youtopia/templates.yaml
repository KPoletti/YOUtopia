    - {args: [3, [0, 0, 0, 0]], expected: -1}
    - {args: [7, [1, 2, 1, 0, 2, 1, 0, 1]], expected: 3}
    - {args: [1, [1, 0]], expected: 1}
    - {args: [4, [0, 0, 0, 0, 4]], expected: 1}
    - {args: [8, [4, 0, 0, 0, 0, 0, 0, 0, 4]], expected: 2}


