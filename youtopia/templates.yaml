    - {args: [[0, 0, 0]], expected: 0}
    - {args: [[1, 2, 3]], expected: 2}
    - {args: [[9, 1, 9]], expected: 0}
    - {args: [[4, 7, 7, 2]], expected: 1}

- title: Watering can rounds
  domain: caretaking
  difficulty: 2
  duration_minutes: 15
  instructions: |-
    Plant i stands at position i and needs plants[i] of water; the tap is at position -1. You start at the tap with a full can, walk right watering each plant in order, and walk back to refill (then return) only when the can can't fully water the next plant. Each move of one position is one step. Return the total steps.

    Example 1:
      watering_steps([2, 2, 3, 3], 5) -> 14
    Example 2:
      watering_steps([1, 1, 1, 4, 2, 3], 4) -> 30

    Constraints: 1 <= len(plants) <= 1000; 1 <= plants[i] <= capacity <= 10^6.
  done_criteria: All hidden tests pass.
  function: watering_steps
  signature: 'def watering_steps(plants: list[int], capacity: int) -> int:'
  tests:
    - {args: [[2, 2, 3, 3], 5], expected: 14}
    - {args: [[1, 1, 1, 4, 2, 3], 4], expected: 30}
    - {args: [[7, 7, 7, 7, 7, 7, 7], 8], expected: 49}
    - {args: [[1], 1], expected: 1}
    - {args: [[3, 3], 3], expected: 4}
    - {args: [[1, 2, 3], 6], expected: 3}

- title: Room in the bed
  domain: caretaking
  difficulty: 2
  duration_minutes: 15
  instructions: |-
    A flower bed is a row of plots: 1 is planted, 0 is empty. New plants can't go next to another plant. Return True if n new plants fit.

    Example 1:
      can_plant([1, 0, 0, 0, 1], 1) -> True
    Example 2:
      can_plant([1, 0, 0, 0, 1], 2) -> False

    Constraints: 1 <= len(bed) <= 2 * 10^4; the bed has no adjacent plants; 0 <= n <= len(bed).
  done_criteria: All hidden tests pass.
  function: can_plant
  signature: 'def can_plant(bed: list[int], n: int) -> bool:'
  tests:
    - {args: [[1, 0, 0, 0, 1], 1], expected: true}
    - {args: [[1, 0, 0, 0, 1], 2], expected: false}
    - {args: [[0], 1], expected: true}
    - {args: [[0, 0, 1, 0, 0], 2], expected: true}
    - {args: [[1, 0, 1], 1], expected: false}
    - {args: [[0, 0, 0, 0, 0], 3], expected: true}

- title: Days until warmer
  domain: caretaking
  difficulty: 3
  duration_minutes: 25
  instructions: |-
    For each day's temperature, return how many days you'd wait for a warmer one, or 0 if none comes. The greenhouse plants will thank you.

    Example 1:
      days_until_warmer([73, 74, 75, 71, 69, 72, 76, 73]) -> [1, 1, 4, 2, 1, 1, 0, 0]
    Example 2:
      days_until_warmer([30, 40, 50, 60]) -> [1, 1, 1, 0]

    Constraints: 1 <= len(temps) <= 10^5.
  done_criteria: All hidden tests pass.
