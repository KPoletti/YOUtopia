    - {args: [[1, 2, 2]], expected: 4}
    - {args: [[5]], expected: 1}
    - {args: [[1, 2, 3, 4]], expected: 10}
    - {args: [[4, 3, 2, 1]], expected: 10}
    - {args: [[1, 3, 4, 5, 2]], expected: 11}

- title: Fewest sprinklers
  domain: caretaking
  difficulty: 5
  duration_minutes: 45
  instructions: |-
    A garden runs from 0 to n with a sprinkler at every whole point 0..n. Sprinkler i waters [i - ranges[i], i + ranges[i]]. Return the fewest sprinklers to turn on so the whole garden is watered, or -1 if that's impossible.

    Example 1:
      fewest_sprinklers(5, [3, 4, 1, 1, 0, 0]) -> 1
    Example 2:
      fewest_sprinklers(3, [0, 0, 0, 0]) -> -1

    Constraints: 1 <= n <= 10^4; len(ranges) == n + 1; 0 <= ranges[i] <= 100.
  done_criteria: All hidden tests pass.
  function: fewest_sprinklers
  signature: 'def fewest_sprinklers(n: int, ranges: list[int]) -> int:'
  tests:
