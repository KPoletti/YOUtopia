    - {args: [[5, 4, 3, 2, 1]], expected: 1}
    - {args: [[1, 3, 6, 7, 9, 4, 10, 5, 6]], expected: 6}

- title: Course order
  domain: training
  difficulty: 4
  duration_minutes: 35
  instructions: |-
    Courses are numbered 0 to n-1, and [a, b] means a must come before b. Return an order that takes every course, always choosing the smallest-numbered course available next. Return [] if it's impossible.

    Example 1:
      course_order(4, [[1, 0], [2, 0], [3, 1], [3, 2]]) -> [3, 1, 2, 0]
    Example 2:
