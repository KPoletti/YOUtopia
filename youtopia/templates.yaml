# --- caretaking ----------------------------------------------------------------
- title: Thirsty plants
  domain: caretaking
  difficulty: 1
  duration_minutes: 10
  instructions: |-
    days_since[i] is how many days since plant i was watered. Return how many plants have gone at least limit days.

    Example 1:
      thirsty_plants([1, 4, 3, 7], 3) -> 3
    Example 2:
      thirsty_plants([], 2) -> 0

    Constraints: 0 <= len(days_since) <= 10^4; 1 <= limit <= 365.
  done_criteria: All hidden tests pass.
  function: thirsty_plants
  signature: 'def thirsty_plants(days_since: list[int], limit: int) -> int:'
  tests:
    - {args: [[1, 4, 3, 7], 3], expected: 3}
    - {args: [[], 2], expected: 0}
    - {args: [[0, 0], 1], expected: 0}
    - {args: [[5, 5, 5], 5], expected: 3}
    - {args: [[2], 3], expected: 0}
    - {args: [[10, 1, 10], 10], expected: 2}

- title: Busiest feeding day
  domain: caretaking
  difficulty: 1
  duration_minutes: 10
  instructions: |-
    meals[i] is how many meals the animals had on day i. Return the first day with the most meals.

    Example 1:
      busiest_feeding_day([3, 5, 2, 5]) -> 1
    Example 2:
