    - {args: [[1], 0], expected: 0}
    - {args: [[3, 7], 14], expected: 2}
    - {args: [[5, 10, 25], 30], expected: 2}
    - {args: [[186, 419, 83, 408], 6249], expected: 20}

- title: Shared syllabus
  domain: training
  difficulty: 5
  duration_minutes: 45
  instructions: |-
    Each syllabus is a string of topic letters. Return the length of the longest sequence of topics that appears in both, in order (not necessarily next to each other).

