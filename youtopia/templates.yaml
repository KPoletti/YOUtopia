    - {args: [[30, 40, 50, 60]], expected: [1, 1, 1, 0]}
    - {args: [[30, 60, 90]], expected: [1, 1, 0]}
    - {args: [[50]], expected: [0]}
    - {args: [[60, 50, 40]], expected: [0, 0, 0]}
    - {args: [[34, 80, 80, 34, 34, 80, 80, 80, 80, 34]], expected: [1, 0, 0, 2, 1, 0, 0, 0, 0, 0]}

- title: Quietest spot
  domain: caretaking
  difficulty: 3
  duration_minutes: 20
  instructions: |-
    In a row of seats, 1 is taken and 0 is free. You want to sit as far as possible from the nearest person. Return that greatest distance.

    Example 1:
      best_spot([1, 0, 0, 0, 1, 0, 1]) -> 2
    Example 2:
      best_spot([1, 0, 0, 0]) -> 3

    Constraints: 2 <= len(seats) <= 2 * 10^4; at least one seat is free and one is taken.
  done_criteria: All hidden tests pass.
  function: best_spot
  signature: 'def best_spot(seats: list[int]) -> int:'
  tests:
