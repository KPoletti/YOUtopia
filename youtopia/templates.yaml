    - {args: [[1, 0, 0, 0]], expected: 3}
    - {args: [[0, 1]], expected: 1}
    - {args: [[1, 0]], expected: 1}
    - {args: [[0, 0, 1, 0, 0, 0, 0, 1]], expected: 2}
    - {args: [[1, 0, 1, 0, 1]], expected: 1}

- title: Largest garden bed
  domain: caretaking
  difficulty: 4
  duration_minutes: 30
  instructions: |-
    '#' is soil and '.' is path. Soil cells that touch up, down, left or right form one bed. Return the number of cells in the largest bed (0 if there's no soil).

    Example 1:
      largest_garden_bed(['##..#', '#...#', '..#..', '....#']) -> 3
    Example 2:
      largest_garden_bed(['...']) -> 0

    Constraints: 1 <= rows, cols <= 50.
  done_criteria: All hidden tests pass.
