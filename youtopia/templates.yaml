    - {args: [2, [[0, 1], [1, 0]]], expected: []}
    - {args: [1, []], expected: [0]}
    - {args: [3, []], expected: [0, 1, 2]}
    - {args: [3, [[2, 1], [1, 0]]], expected: [2, 1, 0]}
    - {args: [5, [[0, 4], [1, 4], [4, 2]]], expected: [0, 1, 3, 4, 2]}

- title: Fewest lessons
  domain: training
