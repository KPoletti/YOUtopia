version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so compromised versions get caught first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so compromised versions get caught first.
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
