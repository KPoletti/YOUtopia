# Documentation site for YOUtopia, built with Zensical (https://zensical.org).
# Preview: uv run zensical serve    Build: uv run zensical build --clean

[project]
site_name = "YOUtopia"
site_description = "AI handles the toil. You get the good part: three small, meaningful things a day."
site_author = "KPoletti"
site_url = "https://kpoletti.github.io/YOUtopia/"
repo_url = "https://github.com/KPoletti/YOUtopia"
repo_name = "KPoletti/YOUtopia"
copyright = "Built for a kinder future."
extra_css = ["stylesheets/utopia.css"]
extra_javascript = ["javascripts/utopia.js"]
nav = [
  { "Home" = "index.md" },
  { "Vision" = "vision.md" },
  { "Guide" = [
    "getting-started.md",
    "commands.md",
    "tone.md",
    "ai-providers.md",
    "privacy-and-safety.md",
  ] },
  { "Project" = [
    "roadmap.md",
    "contributing.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.icon]
logo = "lucide/sunrise"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
